<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recruitment Copilot</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>AI Recruitment Copilot</h1>

        <p class="subtitle">
            Upload a resume and compare it with a job description using a multi-agent recruitment analysis pipeline.
        </p>

        <form id="match-form">

            <input type="file" id="resume" accept=".pdf,.docx,.txt" required>

            <textarea id="job-description" placeholder="Paste job description here..." required></textarea>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        <button type="button" id="history-button" class="secondary-button">
            View Recent History
        </button>

        <div id="history"></div>

        <div id="result"></div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
